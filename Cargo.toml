[package]
name = "flashnpm"
version = "0.1.0"
edition = "2021"
description = "Flash npm — a fast, tiny npm-registry package manager in idiomatic Rust"
license = "MIT"
repository = "https://github.com/sonyarianto/flashnpm.git"
keywords = ["npm", "package-manager", "registry"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "flashnpm"
path = "src/lib.rs"

[[bin]]
name = "flashnpm"
path = "src/main.rs"

[[bin]]
name = "flashnpx"
path = "src/flashnpx.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-manual-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = "2"
url = "2"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
flate2 = "1"
tar = "0.4"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tempfile = "3"
walkdir = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
